name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build -c Release

      - name: Publish Native AOT executable
        run: dotnet publish -c Release -r win-x64 -o publish-aot

      - name: Create standalone release archive
        shell: pwsh
        run: Compress-Archive -Path publish-aot/MftFileSearch.exe,README.md,LICENSE -DestinationPath MftFileSearch-win-x64.zip

      - name: Create complete Skill archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-skill\mft-file-search\tools
          Copy-Item skills\mft-file-search\SKILL.md release-skill\mft-file-search\SKILL.md
          Copy-Item publish-aot\MftFileSearch.exe release-skill\mft-file-search\tools\MftFileSearch.exe
          Compress-Archive -Path release-skill\mft-file-search -DestinationPath mft-file-search-skill-win-x64.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MftFileSearch-win-x64
          path: |
            MftFileSearch-win-x64.zip
            mft-file-search-skill-win-x64.zip

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MftFileSearch-win-x64.zip
            mft-file-search-skill-win-x64.zip
          generate_release_notes: true
